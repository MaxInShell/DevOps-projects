apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: create-ratelimit
  namespace: shortener
spec:
  rateLimit:
    # создание ссылок ограничиваем, редиректы - нет
    average: 5
    burst: 10
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: shortener
spec:
  headers:
    stsSeconds: 31536000
    contentTypeNosniff: true
    browserXssFilter: true
    referrerPolicy: no-referrer
