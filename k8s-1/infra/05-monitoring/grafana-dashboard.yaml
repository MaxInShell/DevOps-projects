apiVersion: v1
kind: ConfigMap
metadata:
  name: shortener-dashboard
  namespace: shortener
  labels:
    grafana_dashboard: "1"
data:
  shortener.json: |
    {
      "title": "URL shortener lab",
      "uid": "shortener-lab",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "tags": [
        "lab",
        "shortener"
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0,
            "label": "Datasource"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "RPS по маршрутам",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (route) (rate(shortener_requests_total[5m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Ошибки 5xx, доля",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(shortener_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(shortener_requests_total[5m])), 0.001)",
              "legendFormat": "error rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Латентность редиректа p50/p95",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(shortener_request_duration_seconds_bucket{route=\"/{code}\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Кэш-хит Redis",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(shortener_cache_hits_total[5m])) / clamp_min(sum(rate(shortener_cache_hits_total[5m])) + sum(rate(shortener_cache_misses_total[5m])), 0.001)",
              "legendFormat": "hit ratio",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Kafka: опубликовано и обработано",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(shortener_clicks_published_total[5m]))",
              "legendFormat": "published",
              "refId": "A"
            },
            {
              "expr": "sum(rate(clicks_consumed_total[5m]))",
              "legendFormat": "consumed",
              "refId": "B"
            }
          ]
        },
        {
          "id": 6,
          "title": "Consumer lag",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(kminion_kafka_consumer_group_topic_lag{group=\"clicks-consumer\"})",
              "legendFormat": "lag",
              "refId": "A"
            }
          ]
        }
      ]
    }
