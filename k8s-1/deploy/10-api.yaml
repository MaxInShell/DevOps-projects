apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortener-api
  namespace: shortener
  labels:
    app: shortener-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shortener-api
  template:
    metadata:
      labels:
        app: shortener-api
    spec:
      serviceAccountName: shortener
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: shortener-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PGHOST
              value: pg-cluster-rw
            - name: PGDATABASE
              value: shortener
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: pg-app-secret
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app-secret
                  key: password
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: KAFKA_BOOTSTRAP
              value: kafka-kafka-bootstrap:9092
            - name: KAFKA_TOPIC
              value: clicks
            - name: PUBLIC_BASE_URL
              value: https://links.lab.local
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: shortener-api
  namespace: shortener
  labels:
    app: shortener-api
spec:
  selector:
    app: shortener-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shortener-api
  namespace: shortener
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: shortener-api
